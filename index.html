<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>坦克大战</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="game-frame" aria-label="坦克大战游戏">
      <canvas id="game" width="624" height="624" aria-label="坦克大战战场"></canvas>
      <div class="mobile-controls" aria-label="触控操作">
        <button class="pad up" data-dir="up" aria-label="向上">▲</button>
        <button class="pad left" data-dir="left" aria-label="向左">◀</button>
        <button class="pad down" data-dir="down" aria-label="向下">▼</button>
        <button class="pad right" data-dir="right" aria-label="向右">▶</button>
        <button class="fire" data-action="fire" aria-label="开火">●</button>
      </div>
    </section>

    <aside class="hud" aria-label="游戏状态">
      <h1>坦克大战</h1>
      <dl class="stats">
        <div><dt>分数</dt><dd id="score">0</dd></div>
        <div><dt>关卡</dt><dd id="level">1</dd></div>
        <div><dt>生命</dt><dd id="lives">3</dd></div>
        <div><dt>敌人</dt><dd id="enemies">0</dd></div>
      </dl>

      <p id="message" class="message">按回车开始</p>

      <div class="keys" aria-label="键盘操作">
        <span>WASD / 方向键</span>
        <span>空格开火</span>
        <span>P 暂停</span>
        <span>回车开始</span>
      </div>
    </aside>
  </main>

  <script src="game.js"></script>
</body>
</html>
